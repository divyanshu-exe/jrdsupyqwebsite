name: Keep Render Backend Awake

on:
  schedule:
    # Ping every 10 minutes to prevent Render free-tier sleep (15-min idle timeout)
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping CampusArchive Backend Health Endpoint
        run: |
          curl -fsS --max-time 60 https://campusarchive-backend.onrender.com/api/health \
          || curl -fsS --max-time 60 https://campusarchive-backend.onrender.com/
