"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  publish = "_site"
  command = "mkdir -p _site && cp index.html index.css index.js admin.html admin.css admin.js robots.txt sitemap.xml _site/"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
